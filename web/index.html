<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer lifetime value (synthetic data)</title>
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem("clv-theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d1424'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238be9ff' stroke-width='2'/%3E%3Ccircle cx='22.5' cy='11' r='3' fill='%238be9ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/overview" aria-label="Customer lifetime value, home">
        <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
          <rect width="34" height="34" rx="10" fill="#1d1d1f"/>
          <circle cx="17" cy="17" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
          <circle cx="23.5" cy="11.5" r="2.6" fill="#8be9ff"/>
        </svg>
        <span class="brand-name">Lifetime Value</span>
      </a>
      <nav class="nav" aria-label="Pages">
        <a href="#/overview">Overview</a>
        <a href="#/segments">Segments</a>
        <a href="#/customer">Customers</a>
        <a href="#/loyalty">Loyalty</a>
        <a href="#/model">Model</a>
      </nav>
      <div class="topbar-right">
        <span class="asof">Data as of 30 Sep 2026</span>
        <span class="badge" title="All data in this demo is synthetic">Synthetic data</span>
        <button class="theme" id="theme" role="switch" aria-checked="false" aria-label="Dark theme"><span class="track"><span class="knob"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span></span><span class="sr">Dark theme</span></button>
      </div>
    </header>
    <div class="main">
      <main class="content" id="view"><div class="loading">Loading...</div></main>
      <footer class="footer">All data is synthetic, modelled on Primark-style retail behaviour. Not real Primark data. Campaign costs, save rates and loyalty effects are illustrative assumptions.</footer>
    </div>
  </div>
  <noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
